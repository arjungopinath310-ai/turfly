<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Turfly</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8fafc; color: #0f172a; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; box-sizing: border-box; }
  .card { max-width: 360px; width: 100%; text-align: center; background: #fff; border: 1px solid #e2e8f0; border-radius: 20px; padding: 32px 24px; box-shadow: 0 8px 24px -12px rgba(16,24,40,.18); }
  .logo { width: 72px; height: 72px; border-radius: 18px; }
  h1 { font-size: 20px; margin: 16px 0 6px; }
  p { color: #64748b; font-size: 14px; line-height: 1.5; margin: 0 0 20px; }
  button { background: #039855; color: #fff; border: 0; border-radius: 12px; padding: 13px 20px; font-size: 15px; font-weight: 600; width: 100%; }
  button:active { background: #027a48; }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="icon.png" alt="">
    <h1>Can't reach Turfly</h1>
    <p>Check your mobile data or Wi-Fi. Live slots and bookings need an internet connection.</p>
    <button id="retry">Try again</button>
  </div>
  <script src="config.js"></script>
  <script>
    // config.js (written by scripts/build.mjs) holds the live site address.
    function retry() { location.replace(window.TURFLY_URL || "/"); }
    document.getElementById("retry").addEventListener("click", retry);
    window.addEventListener("online", retry);
  </script>
</body>
</html>
