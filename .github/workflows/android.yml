name: Android app

# Builds a test APK of the Turfly app in the cloud. Download it from the run's "Artifacts" section.
# Set the repository variable TURFLY_URL (Settings → Secrets and variables → Actions → Variables) to your server address.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["mobile/**", "public/icons/**", "scripts/make-icons.py", ".github/workflows/android.yml"]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow==11.0.0
      - name: Build debug APK
        working-directory: mobile
        env:
          TURFLY_URL: ${{ vars.TURFLY_URL || 'https://turfly.in' }}
        run: |
          npm ci
          node scripts/build.mjs debug
      - uses: actions/upload-artifact@v4
        with:
          name: turfly-debug-apk
          path: mobile/dist/*.apk
          retention-days: 14
