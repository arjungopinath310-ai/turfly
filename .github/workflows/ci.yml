name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: turfly, POSTGRES_PASSWORD: turfly, POSTGRES_DB: turfly_ci }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U turfly" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://turfly:turfly@localhost:5432/turfly_ci?schema=public
      TEST_DATABASE_URL: postgresql://turfly:turfly@localhost:5432/turfly_ci?schema=test
      NEXTAUTH_SECRET: ci-only-secret-0123456789abcdef0123456789
      NEXTAUTH_URL: http://localhost:3000
      CRON_SECRET: ci-only-cron-secret-0123
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
