<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1a13">
<title>Turfly · You're offline</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f1a13; color: #f5f4ee; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom); box-sizing: border-box; }
  .card { max-width: 360px; width: 100%; text-align: center; padding: 32px 24px; box-sizing: border-box; }
  img { width: 72px; height: 72px; border-radius: 16px; }
  h1 { font-size: 26px; font-weight: 800; font-style: italic; text-transform: uppercase; letter-spacing: -.01em; margin: 18px 0 8px; }
  p { color: #c1bdab; font-size: 15px; line-height: 1.5; margin: 0 0 24px; }
  button { background: #d7f74a; color: #0f1a13; border: 0; border-radius: 6px; padding: 14px 20px; font-size: 15px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; width: 100%; cursor: pointer; }
  button:active { background: #c6e835; }
</style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>Turfly needs an internet connection to show live slots and bookings. Check your mobile data or Wi-Fi and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
  <script>window.addEventListener("online", () => location.reload());</script>
</body>
</html>
